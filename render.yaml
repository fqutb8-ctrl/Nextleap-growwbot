services:
  - type: web
    name: hdfc-mf-faq-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: qwen/qwen3.8-27b
      - key: LLM_API_KEY
        sync: false
      - key: API_WARMUP
        value: "1"
      - key: API_WORKERS
        value: "1"
      - key: CORS_ORIGINS
        value: "*"
